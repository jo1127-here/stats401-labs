<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Lab 3 - Web Data Acquisition</title>

    <link rel="stylesheet" href="../css/style.css">
    <style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f4f7fb;
        color: #333;
        margin: 0;
        padding: 40px 20px;
    }

    h1 {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 25px;
    }

    #table-container {
        width: 90%;
        max-width: 1100px;
        margin: 30px auto;
    }

    #table-container table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        background-color: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    #table-container th {
        background-color: #dce8f5;
        color: #2c3e50;
        font-weight: bold;
        padding: 15px 18px;
        text-align: left;
        border-bottom: 2px solid #c3d4e6;
        cursor: pointer;
    }

    #table-container th:hover {
        background-color: #cbdced;
    }

    #table-container td {
        padding: 13px 18px;
        border-bottom: 1px solid #e8edf2;
    }

    #table-container tbody tr:nth-child(even) {
        background-color: #f7f9fc;
    }

    #table-container tbody tr:hover {
        background-color: #eaf2f8;
    }

    #table-container tbody tr:last-child td {
        border-bottom: none;
    }
</style>
</head>

<body>

    <h1>Lab 3 — Web Data Acquisition</h1>
    <h2>Books Dataset</h2>

    <p>
        This dataset was collected from Books to Scrape using Python,
        requests, and BeautifulSoup.
    </p>

    <p>
        The dataset contains 1,000 book records collected from 50 pages.
        Each record includes the book title, price, rating, and page number.
    </p>

    <div id="table-container"></div>

    <p>
        <a href="../index.html">Back to Home</a>
    </p>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="lab3.js"></script>

</body>

</html>
